<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM-registratie</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #CFA94A; font-size: 10px; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 12px; }
        form { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        label { font-size: 10px; margin-top: 15px; display: block; }

        .field-line { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
        .field-wrapper { position: relative; flex: 1; }

        input {
            width: 100%;
            padding: 8px;
            font-size: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .star-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            color: #333;
        }

        .quick-small {
            padding: 4px 8px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 8px;
            flex: 0 0 auto;
        }

        .km-plus {
            width: 50px;
            padding: 8px;
            font-size: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .quick-btn { flex: 1; padding: 6px; background: #333; color: white; border: none; border-radius: 8px; font-size: 8px; }

        .submit-row { display: flex; gap: 10px; margin-top: 25px; }
        .submit-btn, .clear-btn {
            flex: 1;
            padding: 10px;
            background: #333;
            color: white;
            font-size: 12px;
            border: none;
            border-radius: 8px;
        }

        .bottom-row { display: flex; gap: 10px; margin-top: 30px; }
        .bottom-btn {
            flex: 1;
            padding: 10px;
            background: #333;
            color: white;
            font-size: 12px;
            border: none;
            border-radius: 8px;
        }

        .error {
            color: darkred;
            font-size: 10px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<h2>KM-registratie</h2>

<form id="kmForm">

    <label>Datum</label>
    <input type="date" id="datum" name="datum" required>

    <label>Beginstand (km)</label>
    <input type="number" id="begin" name="begin" required>

    <label>Eindstand (km)</label>
    <div class="field-line">
        <input type="number" id="eind" name="eind" required>
        <input type="number" id="pluskm" class="km-plus" placeholder="+km">
    </div>

    <div id="kmError" class="error">Eindstand kan niet lager zijn dan beginstand.</div>

    <label>Van</label>
    <div class="field-line">
        <div class="field-wrapper">
            <input type="text" id="van" name="van" value="Zwartsluis, Otterbeek 58" required>
            <button type="button" class="star-btn" onclick="fillLocation('van')">⭐</button>
        </div>
        <button type="button" class="quick-small" onclick="document.getElementById('van').value='Zwartsluis, Otterbeek 58'">Zwartsluis</button>
    </div>

    <label>Via</label>
    <div class="field-line">
        <div class="field-wrapper">
            <input type="text" id="via" name="via" placeholder="Via (optioneel)">
            <button type="button" class="star-btn" onclick="fillLocation('via')">⭐</button>
        </div>
    </div>

    <div class="btn-row">
        <button type="button" class="quick-btn" onclick="setVia('Emmeloord')">Emmeloord</button>
        <button type="button" class="quick-btn" onclick="setVia('Heerde')">Heerde</button>
    </div>

    <label>Naar</label>
    <div class="field-line">
        <div class="field-wrapper">
            <input type="text" id="naar" name="naar" value="Zwartsluis, Otterbeek 58" required>
            <button type="button" class="star-btn" onclick="fillLocation('naar')">⭐</button>
        </div>
        <button type="button" class="quick-small" onclick="document.getElementById('naar').value='Zwartsluis, Otterbeek 58'">Zwartsluis</button>
    </div>

    <label>Reden / Bestemming</label>
    <input type="text" id="reden" name="reden" required>

    <div class="btn-row">
        <button type="button" class="quick-btn" onclick="setReason('Tolsma Grisnich')">Tolsma Grisnich</button>
        <button type="button" class="quick-btn" onclick="setReason('Heideveld')">Heideveld</button>
        <button type="button" class="quick-btn" onclick="setReason('Privé')">Privé</button>
    </div>

    <div class="submit-row">
        <button type="submit" class="submit-btn">Opslaan</button>
        <button type="button" class="clear-btn" onclick="clearForm()">Leegmaken</button>
    </div>

</form>

<div class="bottom-row">
    <button class="bottom-btn" onclick="downloadDb()">Download database</button>
    <button class="bottom-btn" onclick="window.location.href='/overzicht'">Overzicht</button>
</div>

<script>
// Datum automatisch op vandaag
document.getElementById("datum").value = new Date().toISOString().split("T")[0];

// Beginstand automatisch vullen met laatste eindstand
async function loadLastKm() {
    const url = window.location.origin + "/api/lastkm";
    const res = await fetch(url);
    const data = await res.json();
    if (data.lastkm) document.getElementById("begin").value = data.lastkm;
}
loadLastKm();

// Locatie invullen
function fillLocation(fieldId) {
    if (!navigator.geolocation) return alert("Locatie niet beschikbaar");

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;
        const data = await fetch(url).then(r => r.json());

        const straat = data.address.road || "";
        const nummer = data.address.house_number || "";
        const plaats = data.address.city || data.address.town || data.address.village || "";

        document.getElementById(fieldId).value = `${straat} ${nummer}, ${plaats}`;
    });
}

// Via-knoppen
function setVia(text) {
    document.getElementById("via").value = text;
    const begin = Number(document.getElementById("begin").value);
    if (!isNaN(begin) && text === "Emmeloord") {
        document.getElementById("eind").value = begin + 50;
    }
}

// Reden-knoppen
function setReason(text) {
    document.getElementById("reden").value = text;
}

// +km berekening
document.getElementById("pluskm").addEventListener("input", () => {
    const begin = Number(document.getElementById("begin").value);
    const plus = Number(document.getElementById("pluskm").value);
    if (!isNaN(begin) && !isNaN(plus)) {
        document.getElementById("eind").value = begin + plus;
    }
});

// KM-validatie
function validateKm() {
    const begin = Number(document.getElementById("begin").value);
    const eind = Number(document.getElementById("eind").value);

    if (!isNaN(begin) && !isNaN(eind) && eind < begin) {
        document.getElementById("kmError").style.display = "block";
        return false;
    }

    document.getElementById("kmError").style.display = "none";
    return true;
}

document.getElementById("eind").addEventListener("blur", validateKm);
document.getElementById("eind").addEventListener("input", validateKm);

// Formulier leegmaken
function clearForm() {
    document.getElementById("datum").value = new Date().toISOString().split("T")[0];
    document.getElementById("van").value = "Zwartsluis, Otterbeek 58";
    document.getElementById("via").value = "";
    document.getElementById("naar").value = "Zwartsluis, Otterbeek 58";
    document.getElementById("reden").value = "";
    document.getElementById("pluskm").value = "";
    document.getElementById("eind").value = "";
    loadLastKm();
    document.getElementById("kmError").style.display = "none";
}

// Opslaan
document.getElementById("kmForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!validateKm()) return;

    const data = Object.fromEntries(new FormData(e.target));

    const apiUrl = window.location.origin + "/api/km";
    const response = await fetch(apiUrl, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    alert(response.ok ? "Rit opgeslagen!" : "Fout bij opslaan.");
});

// ⭐ DOWNLOAD VAN DE ECHTE km.db MET DATUMNAAM
async function downloadDb() {
    const today = new Date().toISOString().split("T")[0];
    const filename = `km-${today}.db`;

    const res = await fetch("/download-db");
    const blob = await res.blob();

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}
</script>

</body>
</html>
