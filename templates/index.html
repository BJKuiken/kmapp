<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM-registratie</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #CFA94A; }
        h2 { text-align: center; margin-bottom: 20px; }
        form { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        label { font-size: 16px; margin-top: 15px; display: block; }

        .field-wrapper {
            position: relative;
            margin-top: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .star-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }

        /* Extra veld rechts van eindstand */
        .km-plus-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .km-plus {
            width: 80px;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .quick-btn { flex: 1; padding: 12px; background: #333; color: white; border: none; border-radius: 8px; font-size: 14px; }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: #333;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
        }

        .download-btn {
            margin-top: 30px;
            padding: 16px;
            width: 100%;
            background: #333;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h2>KM-registratie</h2>

<form id="kmForm">

    <label>Datum</label>
    <input type="date" id="datum" name="datum" required>

    <label>Beginstand (km)</label>
    <div class="field-wrapper">
        <input type="number" id="begin" name="begin" required>
        <button type="button" class="star-btn" onclick="fillLocation('begin')">⭐</button>
    </div>

    <label>Eindstand (km)</label>
    <div class="km-plus-wrapper">
        <div class="field-wrapper" style="flex:1;">
            <input type="number" id="eind" name="eind" required>
            <button type="button" class="star-btn" onclick="fillLocation('eind')">⭐</button>
        </div>

        <input type="number" id="pluskm" class="km-plus" placeholder="+km">
    </div>

    <label>Van</label>
    <div class="field-wrapper">
        <input type="text" id="van" name="van" value="Zwartsluis" required>
        <button type="button" class="star-btn" onclick="fillLocation('van')">⭐</button>
    </div>

    <label>Via</label>
    <div class="field-wrapper">
        <input type="text" id="via" name="via" placeholder="Via (optioneel)">
        <button type="button" class="star-btn" onclick="fillLocation('via')">⭐</button>
    </div>

    <div class="btn-row">
        <button type="button" class="quick-btn" onclick="setVia('Emmeloord')">Emmeloord</button>
        <button type="button" class="quick-btn" onclick="setVia('Heerde')">Heerde</button>
    </div>

    <label>Naar</label>
    <div class="field-wrapper">
        <input type="text" id="naar" name="naar" value="Zwartsluis" required>
        <button type="button" class="star-btn" onclick="fillLocation('naar')">⭐</button>
    </div>

    <label>Reden / Bestemming</label>
    <input type="text" id="reden" name="reden" required>

    <div class="btn-row">
        <button type="button" class="quick-btn" onclick="setReason('Tolsma Grisnich')">Tolsma Grisnich</button>
        <button type="button" class="quick-btn" onclick="setReason('Heideveld')">Heideveld</button>
        <button type="button" class="quick-btn" onclick="setReason('Privé')">Privé</button>
    </div>

    <button type="submit">Opslaan</button>
</form>

<button class="download-btn" onclick="window.location.href='/download-db'">
    Download database (km.db)
</button>

<script>
// Datum automatisch op vandaag
document.getElementById("datum").value = new Date().toISOString().split("T")[0];

// ⭐ Beginstand automatisch vullen met laatste eindstand
async function loadLastKm() {
    const url = window.location.origin + "/api/lastkm";
    const res = await fetch(url);
    const data = await res.json();

    if (data.lastkm) {
        document.getElementById("begin").value = data.lastkm;
    }
}
loadLastKm();

// ⭐ Locatie ophalen en invullen
function fillLocation(fieldId) {
    if (!navigator.geolocation) {
        alert("Locatie niet beschikbaar");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;
            const data = await fetch(url).then(r => r.json());

            const straat = data.address.road || "";
            const nummer = data.address.house_number || "";
            const plaats = data.address.city || data.address.town || data.address.village || "";

            const tekst = `${straat} ${nummer}, ${plaats}`;

            document.getElementById(fieldId).value = tekst;
        },
        () => alert("Kon locatie niet ophalen")
    );
}

// ⭐ Via-knoppen vullen + eindstand berekenen
function setVia(text) {
    document.getElementById("via").value = text;
    const begin = Number(document.getElementById("begin").value);
    if (!isNaN(begin) && text === "Emmeloord") {
        document.getElementById("eind").value = begin + 50;
    }
}

// ⭐ Reden-knoppen vullen
function setReason(text) {
    document.getElementById("reden").value = text;
}

// ⭐ Automatisch eindstand berekenen bij +km
document.getElementById("pluskm").addEventListener("input", () => {
    const begin = Number(document.getElementById("begin").value);
    const plus = Number(document.getElementById("pluskm").value);

    if (!isNaN(begin) && !isNaN(plus)) {
        document.getElementById("eind").value = begin + plus;
    }
});

// ⭐ Formulier versturen
document.getElementById("kmForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));

    const apiUrl = window.location.origin + "/api/km";

    const response = await fetch(apiUrl, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    alert(response.ok ? "Rit opgeslagen!" : "Fout bij opslaan.");
});
</script>

</body>
</html>
